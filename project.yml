# Xcode project spec. Regenerate with `xcodegen generate` after any change; the .xcodeproj is not committed.
name: Horizon
options:
  bundleIdPrefix: com.daniel
  fileTypes:
    icon:   # an Icon Composer document is one opaque file to Xcode (wrapper.icon), compiled by actool with the asset catalog
      file: true
      buildPhase: resources
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: NO
packages:
  HorizonPackage:
    path: .
targets:
  Horizon:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Apps/Horizon
        excludes: [Samples, AppIcon.icon]
      - path: Apps/Shared
      - path: Apps/Horizon/Samples/sample-syllabus.pdf
        buildPhase: resources
      - path: Apps/Horizon/AppIcon.icon   # the Icon Composer document: layered, Liquid Glass; actool compiles it (see options.fileTypes)
        buildPhase: resources
    dependencies:
      - package: HorizonPackage
        product: HorizonCore
      - package: HorizonPackage
        product: IngestKit
      - target: HorizonShare
        embed: true
        destinationFilters: [iOS]
      - target: HorizonWidgets
        embed: true
        destinationFilters: [iOS]
    info:
      path: Apps/Horizon/Info.plist
      properties:
        CFBundleDisplayName: Horizon
        CFBundleName: Horizon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)   # the extensions take the same: App Store validation refuses a mismatch
        ITSAppUsesNonExemptEncryption: false   # HTTPS only
        UILaunchScreen:
          UIColorName: Paper   # the page's colour from the first frame, not white (or black) before it
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSRemindersFullAccessUsageDescription: Horizon writes your deadlines to a Reminders list called Horizon, so they still fire if you stop opening the app, and reads back what you check off there.
        NSCalendarsFullAccessUsageDescription: Horizon reads your calendar to plan your day around classes and appointments. With planning by Claude turned on, the day's events are sent to Anthropic.
        NSCameraUsageDescription: Horizon scans printed syllabi and handouts with the camera.
        NSSupportsLiveActivities: true
        NSUserActivityTypes:   # what a page shows, for Siri's "this" (`View.showsEntity`)
          - com.daniel.horizon.showing.CourseEntity
          - com.daniel.horizon.showing.ItemEntity
          - com.daniel.horizon.showing.PolicyEntity
          - com.daniel.horizon.showing.DocumentEntity
        CFBundleURLTypes:
          - CFBundleURLName: com.daniel.horizon
            CFBundleURLSchemes: [horizon]
        BGTaskSchedulerPermittedIdentifiers: [com.daniel.horizon.ingest, com.daniel.horizon.activity]
        UIBackgroundModes: [processing, fetch]   # fetch: the refresh that moves the plan's Live Activity on (or ends it) while the app is not running
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:   # Export Library's file (`LibraryArchive`, `UTType.horizonLibrary`)
          - UTTypeIdentifier: com.daniel.horizon.library
            UTTypeDescription: Horizon Library
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [horizonlibrary]
        UISupportsDocumentBrowser: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Course document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf, public.image, public.plain-text, org.openxmlformats.wordprocessingml.document]
        LSApplicationCategoryType: public.app-category.education
    entitlements:
      path: Apps/Horizon/Horizon.entitlements
      properties:
        com.apple.security.application-groups: [group.com.daniel.horizon.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daniel.horizon.app   # the paid team's (DECISIONS 2026-10-23): com.daniel.horizon stays held by the free team, which cannot release it
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # AppIcon.icon, the only one used at a 27.0 deployment target (Assets.xcassets/AppIcon.appiconset is for systems before 26)
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor   # Design.accentInk's values as the app's accent: on a Mac, what selections and focus rings take (when the system's accent is Multicolour)
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        # CloudKit mirroring needs a paid team: when one exists, define HORIZON_CLOUDKIT for the HorizonCore and HorizonCoreTests targets
        # in Package.swift (swiftSettings: [.define("HORIZON_CLOUDKIT")]; an app target's conditions never reach a package, and the
        # tests have an #if of their own) and add the iCloud entitlements.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited)
        # macOS: signed with the team's development identity but without the App Group entitlement (local store fallback),
        # so the app's identity is stable across builds and the Reminders and Calendar grants it is given persist.
        # An ad-hoc signature changes with every build, and TCC then treats each build as a new app and denies it unasked.
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "Apple Development"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Apps/Horizon/Horizon-macOS.entitlements
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: sample-syllabus.pdf   # the sample feeds DEBUG paths only (Settings ▸ Debug, --ingest-sample)
  HorizonShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/HorizonShare
    dependencies:
      - package: HorizonPackage
        product: HorizonCore
    info:
      path: Apps/HorizonShare/Info.plist
      properties:
        CFBundleDisplayName: Horizon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 5
              NSExtensionActivationSupportsImageWithMaxCount: 5
              NSExtensionActivationSupportsText: true
    entitlements:
      path: Apps/HorizonShare/HorizonShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.daniel.horizon.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daniel.horizon.app.share
        GENERATE_INFOPLIST_FILE: NO
  HorizonWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/HorizonWidgets
      - path: Apps/Shared
    dependencies:
      - package: HorizonPackage   # the glance's types (`Glance`, `Strip.heat`); the extension reads the glance file, never the store
        product: HorizonCore
    entitlements:
      path: Apps/HorizonWidgets/HorizonWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.daniel.horizon.app]   # where the app leaves the glance
    info:
      path: Apps/HorizonWidgets/Info.plist
      properties:
        CFBundleDisplayName: Horizon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daniel.horizon.app.widgets
        GENERATE_INFOPLIST_FILE: NO
  HorizonIntentTests:   # the App Intents through the system's own infrastructure (AppIntentsTesting): Siri's, Shortcuts' and Spotlight's way in
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/HorizonIntentTests
    dependencies:
      - target: Horizon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daniel.horizon.app.intenttests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Horizon
  HorizonSiriTests:   # Siri on a device, through XCUITest alone (AppIntentsTesting loads only on an OS matching Xcode's); skips unless TEST_RUNNER_HORIZON_SIRI=1
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/HorizonSiriTests
    dependencies:
      - target: Horizon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daniel.horizon.app.siritests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Horizon
schemes:
  Horizon:
    build:
      targets:
        Horizon: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HorizonIntentTests
        - HorizonSiriTests
