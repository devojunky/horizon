# Xcode project spec. Regenerate with `xcodegen generate` after any change; the .xcodeproj is not committed.
name: Horizon
options:
  bundleIdPrefix: com.daniel
  fileTypes:
    icon:   # an Icon Composer document is one opaque file to Xcode (folder.iconcomposer.icon), compiled by actool with the asset catalog
      file: true
      buildPhase: resources
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: NO
packages:
  HorizonPackage:
    path: .
targets:
  Horizon:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Apps/Horizon
        excludes: [Samples, AppIcon.icon]
      - path: Apps/Horizon/Samples/sample-syllabus.pdf
        buildPhase: resources
      - path: Apps/Horizon/AppIcon.icon   # the Icon Composer document: layered, Liquid Glass; actool compiles it (see options.fileTypes)
        buildPhase: resources
    dependencies:
      - package: HorizonPackage
        product: HorizonCore
      - package: HorizonPackage
        product: IngestKit
      - target: HorizonShare
        embed: true
        destinationFilters: [iOS]
    info:
      path: Apps/Horizon/Info.plist
      properties:
        CFBundleDisplayName: Horizon
        CFBundleName: Horizon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSRemindersFullAccessUsageDescription: Horizon writes your deadlines to a Reminders list called Horizon, so they still fire if you stop opening the app.
        NSCalendarsFullAccessUsageDescription: Horizon reads your calendar to plan around classes and appointments.
        NSCameraUsageDescription: Horizon scans printed syllabi and handouts with the camera.
        CFBundleURLTypes:
          - CFBundleURLName: com.daniel.horizon
            CFBundleURLSchemes: [horizon]
        BGTaskSchedulerPermittedIdentifiers: [com.daniel.horizon.ingest]
        UIBackgroundModes: [processing]
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Course document
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf, public.image, public.plain-text, org.openxmlformats.wordprocessingml.document]
        LSApplicationCategoryType: public.app-category.education
    entitlements:
      path: Apps/Horizon/Horizon.entitlements
      properties:
        com.apple.security.application-groups: [group.com.daniel.horizon]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daniel.horizon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # AppIcon.icon on OS 26+, Assets.xcassets/AppIcon.appiconset before
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        # CloudKit mirroring needs a paid team: add HORIZON_CLOUDKIT here and iCloud entitlements when one exists.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited)
        # macOS: signed with the team's development identity but without the App Group entitlement (local store fallback),
        # so the app's identity is stable across builds and the Reminders and Calendar grants it is given persist.
        # An ad-hoc signature changes with every build, and TCC then treats each build as a new app and denies it unasked.
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "Apple Development"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Apps/Horizon/Horizon-macOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": $(HORIZON_IOS_ENTITLEMENTS)   # Horizon-PCC.entitlements once the PCC entitlement is granted (Local.xcconfig)
  HorizonShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/HorizonShare
    dependencies:
      - package: HorizonPackage
        product: HorizonCore
    info:
      path: Apps/HorizonShare/Info.plist
      properties:
        CFBundleDisplayName: Horizon
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 5
              NSExtensionActivationSupportsImageWithMaxCount: 5
              NSExtensionActivationSupportsText: true
    entitlements:
      path: Apps/HorizonShare/HorizonShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.daniel.horizon]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daniel.horizon.share
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Horizon:
    build:
      targets:
        Horizon: all
    run:
      config: Debug
    test:
      config: Debug
